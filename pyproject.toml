[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underwriting-ml-platform"
version = "0.1.0"
description = "Reproducible machine learning platform for credit risk and underwriting decisions"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.8,<4",
    "pytest>=8,<10"
]